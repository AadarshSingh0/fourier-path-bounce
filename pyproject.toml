[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-path-bounce"
version = "0.1.0"
description = "Reusable Fourier path preconditioning for multi-field bounce solvers"
readme = "fourier_path_bounce/README.md"
authors = [
  {name = "Aadarsh Singh"},
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "jax",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
cosmotransitions = ["cosmoTransitions>=2.0.7,<3"]

[project.urls]
Repository = "https://github.com/AadarshSingh0/fourier-path-bounce"
Issues = "https://github.com/AadarshSingh0/fourier-path-bounce/issues"

[project.scripts]
fourier-path-bounce = "fourier_path_bounce.cli:main"

[tool.setuptools.packages.find]
include = ["fourier_path_bounce*", "examples*", "tests*"]

[tool.setuptools.package-data]
fourier_path_bounce = ["README.md", "models/README.md", "wolfram/*.wl", "wolfram/README.md"]
examples = ["README.md", "*.wls"]
"examples.xsm" = ["README.md", "*.wls"]
tests = ["README.md", "fixtures/*.json", "fixtures/README.md"]
